spring:
  application:
    name: trading-mis
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portsidedb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false
    username: ${DB_USER:portside_app}
    password: ${DB_PASSWORD:portside_app}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

portside:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-prod-please-this-needs-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

logging:
  level:
    com.portside.trading: INFO
    org.hibernate.SQL: WARN
