spring:
  datasource:
    url: jdbc:h2:mem:portside_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

portside:
  jwt:
    secret: test-only-secret-not-for-production-use-32-bytes-minimum
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173
